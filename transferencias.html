<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transferencias - Banca 360</title>
    <link rel="stylesheet" href="./assets/styles/stylesOperations.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <header class="navbar-dashboard">
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="menu-container">
                <button class="btn-hamburger" id="hamburger-btn">
                    <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                </button>
                <div class="dropdown-menu" id="nav-dropdown">
                    <a href="depositos.html">Depósitos</a>
                    <a href="pagomovil.html">Pago Móvil</a>
                    <a href="transferencias.html">Transferencias</a>
                    <hr class="nav-divider">
                    <a href="dashboard.html" class="nav-mobile-only">Inicio</a>
                    <a href="historial.html" class="nav-mobile-only">Movimientos</a>
                    <a href="logout.html" class="nav-mobile-only">Cerrar Sesión</a>
                </div>
            </div>
            <div class="logo-area">
                <img src="./assets/images/logoDeBanco.png" alt="Logo" width="40">
                <span>Banca 360</span>
            </div>
        </div>
        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-item">Inicio</a>
            <a href="logout.html" class="nav-item logout">Cerrar Sesión</a>
        </nav>
    </header>

    <main class="main-content">
        <a href="dashboard.html" class="btn-back">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 5px;"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Volver al Inicio
        </a>

        <section class="operation-card">
            <div class="operation-header">
                <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="var(--azul-primario)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 10px;"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                <h2>Transferencia Bancaria</h2>
                <p>Envía fondos de forma segura a otras cuentas</p>
            </div>

            <form id="form-transferencia">
                <div class="form-group">
                    <label for="cuenta-origen">Cuenta de Origen</label>
                    <select id="cuenta-origen" class="form-control" required>
                        <option value="corriente">Cuenta Corriente - **** 1234 ($12.850,00)</option>
                        <option value="ahorro">Cuenta de Ahorros - **** 5678 ($5.200,00)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="banco-destino">Banco Destino</label>
                    <select id="banco-destino" class="form-control" required>
                        <option value="">Seleccione un banco</option>
                        <option value="banca360">Banca 360 (Mismo Banco)</option>
                        <option value="banesco">Banesco</option>
                        <option value="mercantil">Mercantil</option>
                        <option value="provincial">Provincial</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="numero-cuenta">Número de Cuenta</label>
                    <input type="text" id="numero-cuenta" class="form-control" placeholder="0123 4567 8901 2345 6789"
                        required>
                </div>

                <div class="form-group">
                    <label for="monto">Monto a Transferir ($)</label>
                    <input type="number" id="monto" class="form-control" placeholder="0.00" step="0.01" min="0.01"
                        required>
                </div>

                <div class="form-group">
                    <label for="concepto">Concepto / Referencia</label>
                    <input type="text" id="concepto" class="form-control" placeholder="Ej: Pago de servicios">
                </div>

                <button type="submit" class="btn-primary">Confirmar Transferencia</button>
            </form>
        </section>
    </main>

    <button id="btn-tema" class="theme-switch-btn">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

    <script src="./assets/scripts/operations.js"></script>
</body>

</html>
