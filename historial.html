<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca 360 - Historial</title>
    <link rel="stylesheet" href="./assets/styles/stylesDashboard.css">
    <link rel="stylesheet" href="./assets/styles/spinner.css">


</head>

<body>
    <header class="navbar">
        <div class="nav-left">
            <div class="logo-area">
                <img src="./assets/images/logoDeBanco.png" alt="Logo" width="35">
                <span>Banca 360</span>
            </div>
        </div>
        <nav class="nav-right">
            <a href="dashboard.html" class="btn-nav">Inicio</a>
            <a href="historial.html" class="btn-nav active">Movimientos</a>
            <a href="logout.html" class="btn-nav">Salir</a>
        </nav>
    </header>

    <main class="container-history" style="max-width: 900px; margin: 40px auto; padding: 0 20px;">
        <section class="card">
            <div class="filter-container">
                <h2 class="section-title">Historial Completo</h2>
                <div class="filter-bar-horizontal">
                    <button class="opt-filter active" onclick="filtrar('todos', this)">Todos</button>
                    <button class="opt-filter" onclick="filtrar('entrada', this)">Entradas</button>
                    <button class="opt-filter" onclick="filtrar('salida', this)">Salidas</button>
                </div>
            </div>

            <table class="data-table">
                <tbody id="tabla-historial">
                </tbody>
            </table>
        </section>
    </main>



    <button id="btn-tema" class="theme-switch-btn">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

    <script src="./assets/scripts/dashboard.js"></script>
</body>

</html>
