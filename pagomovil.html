<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Móvil - Banca 360</title>
    <link rel="stylesheet" href="./assets/styles/stylesOperations.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header class="navbar-dashboard">
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="menu-container">
                <button class="btn-hamburger" id="hamburger-btn">
                    <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
                        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
                    </svg>
                </button>
                <div class="dropdown-menu" id="nav-dropdown">
                    <a href="depositos.html">Depósitos</a>
                    <a href="pagomovil.html">Pago Móvil</a>
                    <a href="transferencias.html">Transferencias</a>
                    <hr class="nav-divider">
                    <a href="dashboard.html" class="nav-mobile-only">Inicio</a>
                    <a href="historial.html" class="nav-mobile-only">Movimientos</a>
                    <a href="logout.html" class="nav-mobile-only">Cerrar Sesión</a>
                </div>
            </div>
            <div class="logo-area">
                <img src="./assets/images/logoDeBanco.png" alt="Logo" width="40">
                <span>Banca 360</span>
            </div>
        </div>
        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-item">Inicio</a>
            <a href="logout.html" class="nav-item logout">Cerrar Sesión</a>
        </nav>
    </header>

    <main class="main-content">
        <a href="dashboard.html" class="btn-back">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 5px;">
                <line x1="19" y1="12" x2="5" y2="12" />
                <polyline points="12 19 5 12 12 5" />
            </svg> Volver al Inicio
        </a>

        <section class="operation-card">
            <div class="operation-header">
                <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="var(--azul-primario)"
                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 10px;">
                    <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
                    <line x1="12" y1="18" x2="12.01" y2="18" />
                </svg>
                <h2>Pago Móvil</h2>
                <p>Pagos rápidos interbancarios</p>
            </div>

            <form id="form-pagomovil">
                <div class="form-group">
                    <label for="banco-destino">Banco Destino</label>
                    <select id="banco-destino" class="form-control" required>
                        <option value="">Seleccione un banco</option>
                        <option value="banesco">Banesco</option>
                        <option value="mercantil">Mercantil</option>
                        <option value="provincial">Provincial</option>
                        <option value="venezuela">Banco de Venezuela</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="telefono">Número de Teléfono</label>
                    <div style="display: flex; gap: 10px;">
                        <select class="form-control" style="width: 100px;">
                            <option value="0414">0414</option>
                            <option value="0424">0424</option>
                            <option value="0412">0412</option>
                            <option value="0416">0416</option>
                            <option value="0426">0426</option>
                        </select>
                        <input type="text" id="telefono" class="form-control" placeholder="1234567" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="cedula">Cédula de Identidad</label>
                    <div style="display: flex; gap: 10px;">
                        <select class="form-control" style="width: 80px;">
                            <option value="V">V</option>
                            <option value="E">E</option>
                            <option value="J">J</option>
                        </select>
                        <input type="text" id="cedula" class="form-control" placeholder="20123456" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="monto">Monto ($)</label>
                    <input type="number" id="monto" class="form-control" placeholder="0.00" step="0.01" min="0.01"
                        required>
                </div>

                <button type="submit" class="btn-primary">Enviar Pago Móvil</button>
            </form>
        </section>
    </main>

    <button id="btn-tema" class="theme-switch-btn">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
    </button>

    <script src="./assets/scripts/operations.js"></script>
</body>

</html>
