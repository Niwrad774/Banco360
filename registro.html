<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Banco360 en linea</title>
        <link rel="stylesheet" href="assets/styles/stylesRegister.css">
    </head>

<body>
    <section>
        <div class="wrapper">
            <div class="form-box register">
                <h2>Registro</h2>
                <form action="#">
                    <div class="input-box">
                        <span class="icon"><ion-icon name="person-outline"></ion-icon></span>
                        <input type="text" required>
                        <label>Nombre</label>
                    </div>
                    <div class="input-box">
                        <span class="icon"><ion-icon name="person-outline"></ion-icon></span>
                        <input type="text" required>
                        <label>Apellido</label>
                    </div>
                    <div class="input-box">
                        <span class="icon"><ion-icon name="mail-outline"></ion-icon></span>
                        <input type="email" required>
                        <label>Email</label>
                    </div>
                    <div class="input-box">
                        <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
                        <input type="password" id="pass" required>
                            <label>Contraseña (6 números)</label>
                    </div>
                    <div class="input-box">
                        <input type="password" id="confirmPass" required>
                        <label>Confirmar Contraseña</label>
                    
                        <button type="submit" class="botonRegistrarse">Registrarse</button>
                    </div>
                    <div class="login-register">
                        <p>¿Ya tienes una cuenta? <a href="inicio.html" class="login-link">Inicia sesión</a></p>
                    </div>
                </form>
            </div>
        </div>
        
    </section>
    <div class="loader" id="spinner"></div>
    <script src="regexRegistro.js"></script>
</body>
