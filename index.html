<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco 360</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/styles/styles.css">   
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="logo-area">
            <img src="./assets/images/logoDeBanco.png" alt="Logo Banco 360" class="nav-logo" style="height: 45px; width: auto; object-fit: contain;">
            <span>Banca 360</span>
        </a>
        <nav>
            <ul>
                <li><a href="inicio.html" class="nav-link">INICIAR SESIÓN</a>
                    <div class="Inicio-underline"></div>
                </li>

                <img src="./assets/images/logoDeUsuario.png" width="45" height="50" alt="Logo de Usuario">
            </ul>
        </nav>
    </header>


    <main>
        <section class="hero">
            <div class="hero-text">
                <h1>¡Da el paso Banco 360!</h1>
                <p>Disfruta de los mejores productos que harán evolucionar tu negocio</p>
            </div>

            <div class="hero-image">
                <img src="./assets/images/imagenPagoConTarjeta.jpeg" alt="Pago con tarjeta">
            </div>
        </section>

        <section id="imagenes" class="imagenes-section">
            <div class="imagenes-grid">
                
                <article class="imagenes-card centered-card">
                        <div class="imagenes-cliente-container">
                            <img src="./assets/images/genteDeAtencionAlCliente.jpg" 
                                alt="Fotografía" 
                                loading="lazy" 
                                width="374" 
                                height="249">
                        </div>  
                    <div class="imagenes-content">
                        <h3>La mejor atencion al cliente</h3>
                    </div>
                </article>

                <article class="imagenes-card centered-card">
                        <div class="imagenes-image-container">
                            <img src="./assets/images/cajero.jpg" 
                                alt="Fotografía" 
                                loading="lazy" width="374" height="249">
                        </div>
                    <div class="imagenes-content">
                        <h3>Calidad y velocidad en todas tus operaciones</h3>
                    </div>
                </article>

                <article class="imagenes-card centered-card">
                        <div class="imagenes-image-container">
                            <img src="./assets/images/hombreViendoLaptop.avif" 
                                alt="Fotografía" 
                                loading="lazy" width="373" height="560">
                        </div>
                    <div class="imagenes-content">
                        <h3 class="author-name">Facil de usar</h3>
                    </div>
                </article>
            </div>
        </section>

        <div class="controlDeBotonDeComenzar">
            <a href="inicio.html" class="botonDeIngreso">Comenzar</a>
        </div>
    </main>



</body>
